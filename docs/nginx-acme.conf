# anfinances.ru — только порт 80. Копия боевого файла с сервера:
# /etc/nginx/sites-enabled/anfinances.conf
#
# Каталог /var/www/html здесь не годится: сертификатом занимается
# Caddy в контейнере, и токен HTTP-челленджа лежит у него в памяти,
# а не на диске. Поэтому /.well-known/acme-challenge/ уходит в Caddy
# на 127.0.0.1:8080. Всё остальное — редирект на https.
server {
    listen 80;
    listen [::]:80;
    server_name anfinances.ru www.anfinances.ru;

    location /.well-known/acme-challenge/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
