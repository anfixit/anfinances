# Сторонние actions приколочены к SHA, а не к тегу: тег
# перемещаемый, и его владелец может подменить код в любой момент —
# у этих шагов есть доступ к секретам деплоя. Номер версии оставлен
# комментарием, чтобы было видно, что обновлять.

name: Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

# Один прогон за раз. Без этого два пуша подряд шли параллельно: сборка
# старого коммита могла закончиться позже и перезаписать образ, а две
# миграции гонялись за одной ревизией. Ждём, а не отменяем: отменённый
# посреди деплоя прогон хуже очереди.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  notify-start:
    runs-on: ubuntu-latest

    steps:
      - name: Send start notification
        shell: bash
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}

          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          SERVER_URL: ${{ github.server_url }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          if [ -z "$TG_TOKEN" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN is empty"
            exit 1
          fi

          if [ -z "$TG_CHAT" ]; then
            echo "::error::TELEGRAM_CHAT_ID is empty"
            exit 1
          fi

          short_sha="${SHA:0:7}"
          run_url="${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID}"
          commit_url="${SERVER_URL}/${REPOSITORY}/commit/${SHA}"

          # Сообщение уходит с parse_mode=HTML, а сообщение коммита —
          # произвольный текст. Трейлер вида <mail@example.com>
          # телеграм принимает за открывающий тег и отвечает 400,
          # роняя весь деплой на первом же шаге. Экранируем.
          esc() {
            printf '%s' "$1" |
              sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'
          }

          text="🚀 <b>Деплой anfinances начат</b>

          Репозиторий: <code>$(esc "$REPOSITORY")</code>
          Ветка: <code>$(esc "$REF_NAME")</code>
          Commit: <a href=\"${commit_url}\">${short_sha}</a>
          Автор запуска: <code>$(esc "$ACTOR")</code>
          Workflow run: <a href=\"${run_url}\">#${RUN_NUMBER}</a>

          <b>Сообщение commit:</b>
          $(esc "$COMMIT_MESSAGE")

          <b>План:</b>
          1. Проверка backend
          2. Тесты backend
          3. Проверка frontend
          4. Сборка Docker-образов
          5. Публикация в GHCR
          6. Деплой на сервер
          7. Миграции базы данных
          8. Smoke-проверка"

          # Ответ Telegram в публичный лог не пишем: в нём имя и
          # username получателя.
          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 20 \
            --retry 3 \
            --retry-all-errors \
            --output /dev/null \
            -X POST \
            "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true" \
            --data-urlencode "text=${text}" ||
            echo "::warning::Telegram notification failed"

  lint:
    needs:
      - notify-start

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Record start time
        id: timer
        shell: bash
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Install backend dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        # scripts — тоже: seed.py месяцами падал на импорте, и ни
        # тесты, ни проверка типов этого не видели.
        run: uv run mypy app scripts

      - name: Calculate duration
        if: always()
        id: duration
        shell: bash
        run: |
          ended=$(date +%s)
          seconds=$((ended - ${{ steps.timer.outputs.started }}))
          minutes=$((seconds / 60))
          rest=$((seconds % 60))
          echo "value=${minutes} мин ${rest} сек" >> "$GITHUB_OUTPUT"

      - name: Notify Telegram
        if: always()
        uses: ./.github/actions/tg-notify
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat: ${{ secrets.TELEGRAM_CHAT_ID }}
          stage: Проверка качества backend
          status: ${{ job.status }}
          duration: ${{ steps.duration.outputs.value }}
          details: |
            Выполнено:
            • установка зависимостей через uv
            • ruff check
            • ruff format --check
            • mypy app scripts

  test:
    needs:
      - notify-start

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Record start time
        id: timer
        shell: bash
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Install backend dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -q

      - name: Calculate duration
        if: always()
        id: duration
        shell: bash
        run: |
          ended=$(date +%s)
          seconds=$((ended - ${{ steps.timer.outputs.started }}))
          minutes=$((seconds / 60))
          rest=$((seconds % 60))
          echo "value=${minutes} мин ${rest} сек" >> "$GITHUB_OUTPUT"

      - name: Notify Telegram
        if: always()
        uses: ./.github/actions/tg-notify
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat: ${{ secrets.TELEGRAM_CHAT_ID }}
          stage: Тесты backend
          status: ${{ job.status }}
          duration: ${{ steps.duration.outputs.value }}
          details: |
            Команда:
            <code>uv run pytest -q</code>

            Проверены unit и integration тесты backend.

  # Прод — PostgreSQL, а быстрые тесты выше идут на SQLite. SQLite не
  # проверяет внешние ключи, иначе хранит время и деньги, не знает
  # частичных индексов — и именно так до прода доехали падающее
  # восстановление бэкапа и миграции, ни разу не прогнанные целиком.
  postgres:
    needs:
      - notify-start

    runs-on: ubuntu-latest

    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: anfinances
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: anfinances
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anfinances"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: anfinances
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_DB: anfinances
      SECRET_KEY: ci-only-secret-key-that-is-long-enough-0123456789
      TEST_DATABASE_URL: postgresql+asyncpg://anfinances:ci-only-password@localhost:5432/anfinances_test

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Record start time
        id: timer
        shell: bash
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Install backend dependencies
        run: uv sync --frozen

      # Пустая база → head: так поднимается любой новый сервер и так
      # проверяется каждая миграция, а не только последняя.
      - name: Migrations on an empty database
        run: uv run alembic upgrade head

      # Модели и миграции написаны руками — check ловит расхождение.
      - name: Models match migrations
        run: uv run alembic check

      - name: Create test database
        shell: bash
        run: >-
          PGPASSWORD=ci-only-password
          createdb -h localhost -U anfinances anfinances_test

      - name: Tests on PostgreSQL
        run: uv run pytest -q

      - name: Calculate duration
        if: always()
        id: duration
        shell: bash
        run: |
          ended=$(date +%s)
          seconds=$((ended - ${{ steps.timer.outputs.started }}))
          minutes=$((seconds / 60))
          rest=$((seconds % 60))
          echo "value=${minutes} мин ${rest} сек" >> "$GITHUB_OUTPUT"

      - name: Notify Telegram
        if: always()
        uses: ./.github/actions/tg-notify
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat: ${{ secrets.TELEGRAM_CHAT_ID }}
          stage: PostgreSQL
          status: ${{ job.status }}
          duration: ${{ steps.duration.outputs.value }}
          details: |
            Выполнено:
            • alembic upgrade head на пустой базе
            • alembic check
            • pytest на PostgreSQL 16

  bot:
    needs:
      - notify-start

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: bot

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Record start time
        id: timer
        shell: bash
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Install bot dependencies
        run: uv sync --frozen

      - name: Ruff
        run: uv run ruff check . && uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src

      - name: Run tests
        run: uv run pytest -q

      - name: Calculate duration
        if: always()
        id: duration
        shell: bash
        run: |
          ended=$(date +%s)
          seconds=$((ended - ${{ steps.timer.outputs.started }}))
          minutes=$((seconds / 60))
          rest=$((seconds % 60))
          echo "value=${minutes} мин ${rest} сек" >> "$GITHUB_OUTPUT"

      - name: Notify Telegram
        if: always()
        uses: ./.github/actions/tg-notify
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat: ${{ secrets.TELEGRAM_CHAT_ID }}
          stage: Проверка бота
          status: ${{ job.status }}
          duration: ${{ steps.duration.outputs.value }}
          details: |
            Команды:
            <code>uv run ruff check .</code>
            <code>uv run mypy src</code>
            <code>uv run pytest -q</code>

  security:
    # Не в needs у deploy намеренно: новая CVE в чужой зависимости
    # не повод останавливать выкладку своего исправления. Красная
    # job и сообщение в телеграм заметны и так.
    needs:
      - notify-start

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Record start time
        id: timer
        shell: bash
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Python-зависимости backend
        working-directory: backend
        # --python: pip-audit ставит себе отдельное окружение, и без
        # явной версии берёт системную, где наши колёса не встают.
        # --no-deps: список уже полностью зафиксирован uv, разрешать
        # в нём нечего.
        run: |
          uv export --format requirements-txt --no-emit-project > req.txt
          uvx --python 3.13 pip-audit --no-deps -r req.txt

      - name: Python-зависимости бота
        working-directory: bot
        # --python: pip-audit ставит себе отдельное окружение, и без
        # явной версии берёт системную, где наши колёса не встают.
        # --no-deps: список уже полностью зафиксирован uv, разрешать
        # в нём нечего.
        run: |
          uv export --format requirements-txt --no-emit-project > req.txt
          uvx --python 3.13 pip-audit --no-deps -r req.txt

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.8.0

      - name: JS-зависимости frontend
        working-directory: frontend
        # --prod: проверяем то, что уезжает в браузер. У eslint и
        # jsdom свои advisories, но они живут только на машине
        # сборки, и красная job из-за них перестала бы что-то значить.
        run: pnpm install --frozen-lockfile && pnpm audit --audit-level high --prod

      - name: Calculate duration
        if: always()
        id: duration
        shell: bash
        run: |
          ended=$(date +%s)
          seconds=$((ended - ${{ steps.timer.outputs.started }}))
          minutes=$((seconds / 60))
          rest=$((seconds % 60))
          echo "value=${minutes} мин ${rest} сек" >> "$GITHUB_OUTPUT"

      - name: Notify Telegram
        if: always()
        uses: ./.github/actions/tg-notify
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat: ${{ secrets.TELEGRAM_CHAT_ID }}
          stage: Проверка зависимостей на уязвимости
          status: ${{ job.status }}
          duration: ${{ steps.duration.outputs.value }}
          details: |
            Проверено:
            • backend и бот — pip-audit
            • frontend — pnpm audit, только прод-зависимости

            Красный статус не блокирует деплой.

  frontend:
    needs:
      - notify-start

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.8.0
          run_install: false

      - name: Record start time
        id: timer
        shell: bash
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Enable Corepack
        run: corepack enable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: ESLint
        run: pnpm eslint .

      # Тесты фронтенда были, но в CI не запускались.
      - name: Vitest
        run: pnpm exec vitest run

      - name: Calculate duration
        if: always()
        id: duration
        shell: bash
        run: |
          ended=$(date +%s)
          seconds=$((ended - ${{ steps.timer.outputs.started }}))
          minutes=$((seconds / 60))
          rest=$((seconds % 60))
          echo "value=${minutes} мин ${rest} сек" >> "$GITHUB_OUTPUT"

      - name: Notify Telegram
        if: always()
        uses: ./.github/actions/tg-notify
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat: ${{ secrets.TELEGRAM_CHAT_ID }}
          stage: Проверка frontend
          status: ${{ job.status }}
          duration: ${{ steps.duration.outputs.value }}
          details: |
            Выполнено:
            • pnpm install --frozen-lockfile
            • TypeScript/Vite build
            • ESLint
            • Vitest

            Node.js: <code>22</code>
            pnpm: <code>11.8.0</code>

  build-backend:
    needs:
      - lint
      - test
      - postgres

    # Образы и выкладка — только из main. Ручной запуск на другой ветке
    # гоняет проверки и ничего не публикует: иначе ветка попадала бы в
    # прод вместе со своими миграциями.
    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Record start time
        id: timer
        shell: bash
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Prepare backend image name
        id: img
        shell: bash
        run: |
          owner="$(echo "${{ github.repository_owner }}" | tr 'A-Z' 'a-z')"
          echo "ref=${REGISTRY}/${owner}/anfinances-backend" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./backend
          file: ./backend/docker/Dockerfile
          push: true
          tags: |
            ${{ steps.img.outputs.ref }}:latest
            ${{ steps.img.outputs.ref }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Calculate duration
        if: always()
        id: duration
        shell: bash
        run: |
          ended=$(date +%s)
          seconds=$((ended - ${{ steps.timer.outputs.started }}))
          minutes=$((seconds / 60))
          rest=$((seconds % 60))
          echo "value=${minutes} мин ${rest} сек" >> "$GITHUB_OUTPUT"

      - name: Notify Telegram
        if: always()
        uses: ./.github/actions/tg-notify
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat: ${{ secrets.TELEGRAM_CHAT_ID }}
          stage: Сборка backend Docker image
          status: ${{ job.status }}
          duration: ${{ steps.duration.outputs.value }}
          details: |
            Образ:
            <code>${{ steps.img.outputs.ref }}:latest</code>

            Дополнительный тег:
            <code>${{ github.sha }}</code>

            Registry:
            <code>ghcr.io</code>

  build-frontend:
    needs:
      - frontend

    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Record start time
        id: timer
        shell: bash
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Prepare frontend image name
        id: img
        shell: bash
        run: |
          owner="$(echo "${{ github.repository_owner }}" | tr 'A-Z' 'a-z')"
          echo "ref=${REGISTRY}/${owner}/anfinances-frontend" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.img.outputs.ref }}:latest
            ${{ steps.img.outputs.ref }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Calculate duration
        if: always()
        id: duration
        shell: bash
        run: |
          ended=$(date +%s)
          seconds=$((ended - ${{ steps.timer.outputs.started }}))
          minutes=$((seconds / 60))
          rest=$((seconds % 60))
          echo "value=${minutes} мин ${rest} сек" >> "$GITHUB_OUTPUT"

      - name: Notify Telegram
        if: always()
        uses: ./.github/actions/tg-notify
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat: ${{ secrets.TELEGRAM_CHAT_ID }}
          stage: Сборка frontend Docker image
          status: ${{ job.status }}
          duration: ${{ steps.duration.outputs.value }}
          details: |
            Образ:
            <code>${{ steps.img.outputs.ref }}:latest</code>

            Дополнительный тег:
            <code>${{ github.sha }}</code>

            Базовый build image:
            <code>node:22-alpine</code>

  build-bot:
    needs:
      - bot

    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Record start time
        id: timer
        shell: bash
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Prepare bot image name
        id: img
        shell: bash
        run: |
          owner="$(echo "${{ github.repository_owner }}" | tr 'A-Z' 'a-z')"
          echo "ref=${REGISTRY}/${owner}/anfinances-bot" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push bot image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./bot
          file: ./bot/Dockerfile
          push: true
          tags: |
            ${{ steps.img.outputs.ref }}:latest
            ${{ steps.img.outputs.ref }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Calculate duration
        if: always()
        id: duration
        shell: bash
        run: |
          ended=$(date +%s)
          seconds=$((ended - ${{ steps.timer.outputs.started }}))
          minutes=$((seconds / 60))
          rest=$((seconds % 60))
          echo "value=${minutes} мин ${rest} сек" >> "$GITHUB_OUTPUT"

      - name: Notify Telegram
        if: always()
        uses: ./.github/actions/tg-notify
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat: ${{ secrets.TELEGRAM_CHAT_ID }}
          stage: Сборка bot Docker image
          status: ${{ job.status }}
          duration: ${{ steps.duration.outputs.value }}
          details: |
            Образ:
            <code>${{ steps.img.outputs.ref }}:latest</code>

            Дополнительный тег:
            <code>${{ github.sha }}</code>

            Registry:
            <code>ghcr.io</code>

  deploy:
    needs:
      - build-bot
      - build-backend
      - build-frontend

    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    timeout-minutes: 20

    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Record start time
        id: timer
        shell: bash
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SINGLE_USER_EMAIL: ${{ secrets.SINGLE_USER_EMAIL }}
          SINGLE_USER_PASSWORD: ${{ secrets.SINGLE_USER_PASSWORD }}
          TELEGRAM_BOT_TOKEN_FINANCE: ${{ secrets.TELEGRAM_BOT_TOKEN_FINANCE }}
          TELEGRAM_ALLOWED_USER_IDS: ${{ secrets.TELEGRAM_ALLOWED_USER_IDS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BOT_AI_ENABLED: ${{ secrets.BOT_AI_ENABLED }}
          BOT_DEFAULT_ACCOUNTS: ${{ secrets.BOT_DEFAULT_ACCOUNTS }}
          BOT_QUIET_HOURS: ${{ secrets.BOT_QUIET_HOURS }}
          BOT_BUDGET_MEETING_DAY: ${{ secrets.BOT_BUDGET_MEETING_DAY }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: admin
          key: ${{ secrets.SSH_KEY }}
          port: 2810
          command_timeout: 15m
          envs: GHCR_TOKEN,GHCR_USER,OWNER,SECRET_KEY,POSTGRES_PASSWORD,SINGLE_USER_EMAIL,SINGLE_USER_PASSWORD,TELEGRAM_BOT_TOKEN_FINANCE,TELEGRAM_ALLOWED_USER_IDS,ANTHROPIC_API_KEY,OPENAI_API_KEY,BOT_AI_ENABLED,BOT_DEFAULT_ACCOUNTS,BOT_QUIET_HOURS,BOT_BUDGET_MEETING_DAY,BACKUP_PASSPHRASE,DEPLOY_SHA
          script: |
            set -euo pipefail

            cd "${{ secrets.DEPLOY_PATH }}"

            # Ровно коммит этого прогона, а не «что сейчас в main»:
            # раньше git pull и образы :latest могли относиться к разным
            # коммитам, если пуши шли подряд. Откат — тот же прогон для
            # старого коммита: его образы лежат в GHCR под его sha.
            git fetch --quiet origin
            git checkout --quiet --detach "$DEPLOY_SHA"

            owner_lc="$(echo "$OWNER" | tr 'A-Z' 'a-z')"

            export IMAGE_BACKEND="ghcr.io/${owner_lc}/anfinances-backend:${DEPLOY_SHA}"
            export IMAGE_FRONTEND="ghcr.io/${owner_lc}/anfinances-frontend:${DEPLOY_SHA}"
            export IMAGE_BOT="ghcr.io/${owner_lc}/anfinances-bot:${DEPLOY_SHA}"
            export POSTGRES_PASSWORD

            umask 077

            cat > backend/.env <<EOF
            SECRET_KEY=$SECRET_KEY
            POSTGRES_PASSWORD=$POSTGRES_PASSWORD
            AUTH_MODE=single_user
            SINGLE_USER_EMAIL=$SINGLE_USER_EMAIL
            SINGLE_USER_PASSWORD=$SINGLE_USER_PASSWORD
            EOF

            mkdir -p bot
            cat > bot/.env <<EOF
            TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN_FINANCE
            TELEGRAM_ALLOWED_USER_IDS=$TELEGRAM_ALLOWED_USER_IDS
            ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY
            OPENAI_API_KEY=$OPENAI_API_KEY
            BOT_AI_ENABLED=${BOT_AI_ENABLED:-false}
            SINGLE_USER_EMAIL=$SINGLE_USER_EMAIL
            SINGLE_USER_PASSWORD=$SINGLE_USER_PASSWORD
            BOT_DEFAULT_ACCOUNTS=$BOT_DEFAULT_ACCOUNTS
            BOT_QUIET_HOURS=${BOT_QUIET_HOURS:-23-9}
            BOT_BUDGET_MEETING_DAY=${BOT_BUDGET_MEETING_DAY:-15}
            EOF

            # MCP-серверу секреты бота не нужны: в сайт он ходит
            # токеном вызывающего. Только умолчания счетов по валютам.
            cat > bot/mcp.env <<EOF
            BOT_DEFAULT_ACCOUNTS=$BOT_DEFAULT_ACCOUNTS
            EOF

            # Бэкап живёт на хосте, а не в контейнере: ему нужен
            # docker, чтобы снять дамп из postgres.
            cat > backup.env <<EOF
            BACKUP_PASSPHRASE=$BACKUP_PASSPHRASE
            TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN_FINANCE
            TELEGRAM_CHAT_ID=$TELEGRAM_ALLOWED_USER_IDS
            POSTGRES_USER=anfinances
            POSTGRES_DB=anfinances
            EOF
            chmod 600 backup.env

            sudo cp scripts/anfinances-backup.service \
                    scripts/anfinances-backup.timer \
                    /etc/systemd/system/
            sudo systemctl daemon-reload
            sudo systemctl enable --now anfinances-backup.timer

            echo "$GHCR_TOKEN" |
              docker login ghcr.io \
                -u "$GHCR_USER" \
                --password-stdin

            # Только свои образы. postgres и caddy закреплены тегом в
            # compose; общий pull молча тянул их новые сборки и
            # пересоздавал базу посреди деплоя.
            docker compose \
              -f docker-compose.deploy.yml \
              pull backend bot mcp frontend

            # Страховочный дамп перед миграцией: ночной бэкап может
            # быть почти суточной давности. Хранятся последние пять.
            docker compose \
              -f docker-compose.deploy.yml \
              up -d --wait postgres
            # Не в backups/: её создаёт ночной бэкап от root, и деплой
            # (пользователь admin) не может в ней писать. Домашняя папка
            # деплоя — своя, а umask 077 выше закрывает её от остальных.
            pre="$HOME/anfinances-pre-migrate"
            mkdir -p "$pre"
            dump="$pre/$(date -u +%Y%m%dT%H%M%SZ)-${DEPLOY_SHA:0:7}.dump"
            docker compose \
              -f docker-compose.deploy.yml \
              exec -T postgres \
              pg_dump -U anfinances -d anfinances -Fc > "$dump"
            test -s "$dump"
            ls -1t "$pre"/*.dump | tail -n +6 | xargs -r rm --

            # Миграция — новым образом и ДО запуска нового кода. Раньше
            # новый backend стартовал на старой схеме и до миграции
            # отвечал 500 на всё, что трогало новые колонки. Отсюда
            # правило: миграция обязана быть совместимой со старым кодом
            # (добавлять сейчас, удалять — следующим релизом).
            docker compose \
              -f docker-compose.deploy.yml \
              run --rm backend \
              alembic upgrade head

            docker compose \
              -f docker-compose.deploy.yml \
              up -d

            # Caddy читает конфиг только при старте, а compose не
            # пересоздаёт контейнер из-за правки Caddyfile. Без reload
            # новые маршруты доехали бы только со следующим рестартом.
            # Плохой конфиг reload отвергнет, старый продолжит работать,
            # а деплой покраснеет. Несколько попыток — на случай, если
            # контейнер только что пересоздан и admin API ещё не поднялся.
            for attempt in 1 2 3 4 5; do
              if docker compose \
                -f docker-compose.deploy.yml \
                exec -T caddy \
                caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
              then
                break
              fi
              [ "$attempt" = 5 ] && exit 1
              sleep 3
            done

            docker compose \
              -f docker-compose.deploy.yml \
              ps

      - name: Calculate duration
        if: always()
        id: duration
        shell: bash
        run: |
          ended=$(date +%s)
          seconds=$((ended - ${{ steps.timer.outputs.started }}))
          minutes=$((seconds / 60))
          rest=$((seconds % 60))
          echo "value=${minutes} мин ${rest} сек" >> "$GITHUB_OUTPUT"

      - name: Notify Telegram
        if: always()
        uses: ./.github/actions/tg-notify
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat: ${{ secrets.TELEGRAM_CHAT_ID }}
          stage: Деплой на сервер
          status: ${{ job.status }}
          duration: ${{ steps.duration.outputs.value }}
          details: |
            Выполнено:
            • git checkout коммита прогона
            • docker compose pull (свои образы по sha)
            • pg_dump перед миграцией
            • alembic upgrade head
            • docker compose up -d
            • caddy reload
            • docker compose ps

            Сервер:
            <code>${{ secrets.SSH_HOST }}</code>

  smoke:
    needs:
      - deploy

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Record start time
        id: timer
        shell: bash
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Health check
        shell: bash
        run: |
          set -euo pipefail

          url="https://anfinances.ru/api/v1/health/ready"

          for attempt in $(seq 1 10); do
            echo "Health-check attempt ${attempt}/10"

            if response="$(curl --fail --silent --show-error --max-time 10 "$url")"; then
              echo "Response: $response"
              exit 0
            fi

            sleep 6
          done

          echo "Health endpoint did not return success"
          exit 1

      - name: MCP check
        shell: bash
        # Метаданные ресурса — первое, что читают ChatGPT и Claude при
        # подключении. Если вместо JSON отвечает SPA (маршрут в Caddy не
        # доехал) или 502 (контейнер mcp лежит), подключение сломано.
        run: |
          set -euo pipefail

          url="https://anfinances.ru/.well-known/oauth-protected-resource/mcp"

          for attempt in $(seq 1 10); do
            echo "MCP metadata attempt ${attempt}/10"

            if response="$(curl --fail --silent --show-error --max-time 10 "$url")" &&
              echo "$response" |
                jq -e '.resource == "https://anfinances.ru/mcp"' >/dev/null; then
              echo "Response: $response"

              # Без токена /mcp обязан отвечать 401 — с этого клиенты
              # начинают вход.
              code="$(curl --silent --max-time 10 --output /dev/null \
                --write-out '%{http_code}' \
                -X POST https://anfinances.ru/mcp || true)"
              echo "POST /mcp without token: $code"
              [ "$code" = "401" ] && exit 0
            fi

            sleep 6
          done

          echo "MCP endpoint did not respond as expected"
          exit 1

      - name: Calculate duration
        if: always()
        id: duration
        shell: bash
        run: |
          ended=$(date +%s)
          seconds=$((ended - ${{ steps.timer.outputs.started }}))
          minutes=$((seconds / 60))
          rest=$((seconds % 60))
          echo "value=${minutes} мин ${rest} сек" >> "$GITHUB_OUTPUT"

      - name: Notify Telegram
        if: always()
        uses: ./.github/actions/tg-notify
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat: ${{ secrets.TELEGRAM_CHAT_ID }}
          stage: Smoke-проверка production
          status: ${{ job.status }}
          duration: ${{ steps.duration.outputs.value }}
          details: |
            Проверены endpoints:
            <a href="https://anfinances.ru/api/v1/health/ready">health/ready</a>
            <a href="https://anfinances.ru/.well-known/oauth-protected-resource/mcp">MCP metadata</a>, 401 на /mcp без токена

            Production:
            <a href="https://anfinances.ru">anfinances.ru</a>

  summary:
    needs:
      - notify-start
      - lint
      - test
      - postgres
      - bot
      - frontend
      - security
      - build-backend
      - build-frontend
      - build-bot
      - deploy
      - smoke

    if: always()

    runs-on: ubuntu-latest

    steps:
      - name: Send final summary
        shell: bash
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}

          RESULT_LINT: ${{ needs.lint.result }}
          RESULT_TEST: ${{ needs.test.result }}
          RESULT_POSTGRES: ${{ needs.postgres.result }}
          RESULT_BOT: ${{ needs.bot.result }}
          RESULT_FRONTEND: ${{ needs.frontend.result }}
          RESULT_SECURITY: ${{ needs.security.result }}
          RESULT_BUILD_BACKEND: ${{ needs.build-backend.result }}
          RESULT_BUILD_FRONTEND: ${{ needs.build-frontend.result }}
          RESULT_BUILD_BOT: ${{ needs.build-bot.result }}
          RESULT_DEPLOY: ${{ needs.deploy.result }}
          RESULT_SMOKE: ${{ needs.smoke.result }}

          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail

          icon() {
            case "$1" in
              success) echo "✅" ;;
              failure) echo "❌" ;;
              cancelled) echo "🚫" ;;
              skipped) echo "⏭️" ;;
              *) echo "❔" ;;
            esac
          }

          # Итог — по тому, что действительно выкатилось: деплой и
          # smoke оба success. Раньше «пропущен» считался успехом, и при
          # упавших тестах бота приходило «✅ деплой завершён успешно».
          # Проверка зависимостей (security) деплой не блокирует, её
          # провал — отдельная пометка, а не красный итог.
          cancelled=false
          for result in \
            "$RESULT_LINT" "$RESULT_TEST" "$RESULT_POSTGRES" \
            "$RESULT_BOT" "$RESULT_FRONTEND" "$RESULT_BUILD_BACKEND" \
            "$RESULT_BUILD_FRONTEND" "$RESULT_BUILD_BOT" \
            "$RESULT_DEPLOY" "$RESULT_SMOKE"
          do
            if [ "$result" = "cancelled" ]; then
              cancelled=true
            fi
          done

          if [ "$cancelled" = true ]; then
            overall_icon="🚫"
            overall_text="прогон отменён"
          elif [ "$RESULT_DEPLOY" = "success" ] && [ "$RESULT_SMOKE" = "success" ]; then
            overall_icon="✅"
            overall_text="выкачено"
            if [ "$RESULT_SECURITY" != "success" ]; then
              overall_text="выкачено, но проверка зависимостей не прошла"
            fi
          elif [ "$RESULT_DEPLOY" = "success" ]; then
            overall_icon="❌"
            overall_text="выкачено, но smoke-проверка не прошла"
          elif [ "$RESULT_DEPLOY" = "skipped" ] && [ "$REF_NAME" != "main" ]; then
            overall_icon="ℹ️"
            overall_text="проверки ветки ${REF_NAME}, без выкладки"
          else
            overall_icon="❌"
            overall_text="НЕ выкачено"
          fi

          short_sha="${SHA:0:7}"
          run_url="${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID}"
          commit_url="${SERVER_URL}/${REPOSITORY}/commit/${SHA}"

          text="${overall_icon} <b>${overall_text}</b>

          Репозиторий: <code>${REPOSITORY}</code>
          Ветка: <code>${REF_NAME}</code>
          Commit: <a href=\"${commit_url}\">${short_sha}</a>
          Автор: <code>${ACTOR}</code>
          Workflow run: <a href=\"${run_url}\">#${RUN_NUMBER}</a>

          <b>Результаты:</b>
          $(icon "$RESULT_LINT") Backend lint, format, mypy: <code>${RESULT_LINT}</code>
          $(icon "$RESULT_TEST") Backend tests: <code>${RESULT_TEST}</code>
          $(icon "$RESULT_POSTGRES") PostgreSQL, миграции: <code>${RESULT_POSTGRES}</code>
          $(icon "$RESULT_BOT") Bot checks: <code>${RESULT_BOT}</code>
          $(icon "$RESULT_FRONTEND") Frontend checks: <code>${RESULT_FRONTEND}</code>
          $(icon "$RESULT_SECURITY") Dependency audit: <code>${RESULT_SECURITY}</code>
          $(icon "$RESULT_BUILD_BACKEND") Backend image: <code>${RESULT_BUILD_BACKEND}</code>
          $(icon "$RESULT_BUILD_FRONTEND") Frontend image: <code>${RESULT_BUILD_FRONTEND}</code>
          $(icon "$RESULT_BUILD_BOT") Bot image: <code>${RESULT_BUILD_BOT}</code>
          $(icon "$RESULT_DEPLOY") Server deploy: <code>${RESULT_DEPLOY}</code>
          $(icon "$RESULT_SMOKE") Production smoke: <code>${RESULT_SMOKE}</code>

          <b>Production:</b>
          <a href=\"https://anfinances.ru\">https://anfinances.ru</a>

          <b>Логи:</b>
          <a href=\"${run_url}\">открыть GitHub Actions</a>"

          # Ответ Telegram в публичный лог не пишем: в нём имя и
          # username получателя.
          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 20 \
            --retry 3 \
            --retry-all-errors \
            --output /dev/null \
            -X POST \
            "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true" \
            --data-urlencode "text=${text}" ||
            echo "::warning::Telegram notification failed"
