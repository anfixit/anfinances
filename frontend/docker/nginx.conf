# Server-блок фронтенд-образа: отдаёт SPA и проксирует /api/ в backend.
# Кладётся в /etc/nginx/conf.d/default.conf. HTTP (TLS появится с доменом).

# Rate limiting на /auth/* (S4). Директива зоны — в http-контексте:
# conf.d/*.conf включается внутрь http{}, поэтому годится здесь.
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

# Настоящий адрес клиента. Сюда ходит только Caddy из сети compose,
# поэтому без этого $remote_addr — всегда адрес Caddy, и лимит выше
# был один на весь интернет: десять чужих попыток входа в минуту —
# и владелица не могла войти. Caddy присланный клиентом
# X-Forwarded-For отбрасывает и ставит адрес сам, так что верим ему
# в частных сетях, где живут контейнеры. Наружу nginx не опубликован.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Security-заголовки. HSTS не ставим: этот контур ходит по http
    # (TLS появится при переходе на nginx/nginx.conf с доменом).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'self'; frame-ancestors 'none'" always;

    # /auth/* — с анти-флуд лимитом (S4).
    # `^~` — чтобы regex-локация ниже не перехватила запрос к API,
    # если в пути окажется точка.
    location ^~ /api/v1/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location ^~ /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Путь с расширением — это файл, а не маршрут SPA. Раньше он
    # попадал в общий fallback, и на /robots.txt, /sitemap.xml или
    # опечатку в имени бандла приходил ответ 200 с телом index.html.
    # Краулер видел домен, где существует вообще любой адрес, а
    # браузер — «файл» с типом text/html вместо ожидаемого.
    location ~ \.[^/]+$ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    # Кеш. index.html — всегда сверять с сервером: в нём ссылки на
    # бандлы текущей сборки, и закешированный старый index после деплоя
    # просил удалённые бандлы — белый экран до ручного обновления.
    # /assets/ — имена с хэшем содержимого, их можно хранить вечно.
    # `expires`, а не add_header: add_header в location отменил бы
    # заголовки безопасности уровня server.
    location = /index.html {
        root /usr/share/nginx/html;
        expires -1;
    }

    location ^~ /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires max;
    }

    # Остальное — маршруты приложения, их разбирает роутер в браузере.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
