# Dev-окружение: PostgreSQL + Python backend + MCP-сервер.
# Для production используй docker-compose.prod.yml (добавляет nginx).
#
# Запуск:   docker compose up -d
# Логи:     docker compose logs -f backend
# Остановка: docker compose down

services:
  postgres:
    image: postgres:16-alpine
    container_name: anfinances-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-anfinances}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-anfinances}
      POSTGRES_DB: ${POSTGRES_DB:-anfinances}
    ports:
      # Открываем наружу, чтобы можно было подключиться psql/DBeaver-ом с хоста.
      # В prod-compose этот порт не публикуется.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-anfinances} -d ${POSTGRES_DB:-anfinances}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    container_name: anfinances-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # POSTGRES_HOST переопределяется здесь: внутри сети compose БД называется "postgres".
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    env_file:
      - ./backend/.env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    # В dev монтируем код для горячей перезагрузки + переопределяем CMD на --reload.
    volumes:
      - ./backend:/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  # MCP-сервер для ИИ-ассистентов. Проверить локально из Claude Code:
  #   claude mcp add --transport http anfinances http://localhost:8100/mcp \
  #     --header "Authorization: Bearer anf_pat_..."
  mcp:
    build:
      context: ./bot
    container_name: anfinances-mcp
    restart: unless-stopped
    depends_on:
      - backend
    command: ["uv", "run", "--no-dev", "python", "-m", "anfinances_bot.mcp_server"]
    environment:
      ANFINANCES_BASE_URL: http://backend:8000/api/v1
      # Локально ресурс и издатель — адреса на этой машине: клиенты
      # сверяют их строкой с тем, что ввели и что отдал backend.
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-http://localhost:8100/mcp}
      MCP_ISSUER: ${MCP_ISSUER:-http://localhost:8000}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:6274}
    ports:
      - "${MCP_PORT:-8100}:8100"

volumes:
  postgres_data:
    name: anfinances_postgres_data
